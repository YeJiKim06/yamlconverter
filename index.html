<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON ⇄ YAML Converter</title>
    <!-- YAML 파싱 및 변환 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* 제어 문자 분석 판넬 */
        .analysis-panel {
            background: #fff1f0;
            border: 1px solid #ffa39e;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 25px;
        }

        .analysis-panel-title {
            color: #cf1322;
            font-weight: bold;
            margin-bottom: 12px;
            display: block;
            font-size: 14px;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
        }

        @media (max-width: 600px) {
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }

        .analysis-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            border-bottom: 1px dashed #fcdab7;
            padding-bottom: 4px;
        }

        .count-val {
            font-weight: bold;
            color: #cf1322;
            background: rgba(207, 19, 34, 0.1);
            padding: 1px 6px;
            border-radius: 4px;
        }

        /* 메인 레이아웃 */
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        label {
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            font-size: 14px;
            color: #444;
        }

        /* 텍스트 입력창 공통 */
        .editor {
            width: 100%;
            height: 320px;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            box-sizing: border-box;
            resize: none;
            outline: none;
            line-height: 1.6;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* 좌측 JSON 입력창 (라이트 테마) */
        .editor-light {
            border: 1px solid #ddd;
            background: #fff;
            color: #333;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .editor-light:focus {
            border-color: #ff4d4f;
            box-shadow: 0 0 0 2px rgba(255, 77, 79, 0.15);
        }

        /* 우측 YAML 결과창 (다크 테마) */
        .editor-dark {
            border: 1px solid #282c34;
            background: #282c34;
            color: #abb2bf;
            font-family: 'Consolas', 'Courier New', monospace;
            caret-color: #fff;
        }

        .editor-dark:focus {
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.25);
        }

        /* 버튼 그룹 */
        .btn-group {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            flex: 1;
            min-width: 110px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* 빨간색 버튼 (JSON -> YAML) */
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }

        .btn-danger:hover {
            background: #cf1322;
        }

        /* 파란색 버튼 (Copy) */
        .btn-primary {
            background: #1890ff;
            color: white;
        }

        .btn-primary:hover {
            background: #096dd9;
        }

        /* 초록색 버튼 (YAML -> JSON) */
        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
        }

        /* 보조 회색 버튼 */
        .btn-secondary {
            background: #e8e8e8;
            color: #555;
        }

        .btn-secondary:hover {
            background: #d9d9d9;
        }

        /* 아웃라인 버튼 */
        .btn-outline {
            background: transparent;
            border: 1px solid #d9d9d9;
            color: #555;
        }

        .btn-outline:hover {
            background: #f5f5f5;
        }

        /* 상태 알림 창 */
        .status-panel {
            margin-top: 25px;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 8px;
            padding: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: #389e0d;
        }

        .status-panel.error {
            background: #fff2f0;
            border-color: #ffccc7;
            color: #ff4d4f;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛡 JSON ⇄ YAML 스마트 변환기</h2>

    <!-- 변환 편집 영역 -->
    <div class="layout">
        <!-- 좌측 JSON 구역 -->
        <div>
            <label>JSON INPUT (라이트 에디터)</label>
            <textarea id="json-input" class="editor editor-light" placeholder='{\n    "service": "converter",\n    "features": [\n        "json-to-yaml",\n        "yaml-to-json"\n    ],\n    "spaces": 4\n}'></textarea>
            <div class="btn-group">
                <button class="btn-danger" onclick="convertToYaml()">YAML로 변환 ➔</button>
                <button class="btn-secondary" onclick="clearJson()">입력 초기화</button>
            </div>
        </div>

        <!-- 우측 YAML 구역 -->
        <div>
            <label>YAML OUTPUT (다크 에디터)</label>
            <textarea id="yaml-input" class="editor editor-dark" placeholder="service: converter&#10;features:&#10;    - json-to-yaml&#10;    - yaml-to-json&#10;spaces: 4"></textarea>
            <div class="btn-group">
                <button class="btn-primary" onclick="copyYaml()">YAML 결과 복사</button>
                <button class="btn-success" onclick="convertToInvertedJson()">⇠ JSON으로 변환</button>
                <button class="btn-outline" onclick="clearYaml()">결과 초기화</button>
            </div>
        </div>
    </div>

    <!-- 하단 상태 및 알림 보드 -->
    <div id="status-board" class="status-panel"></div>
</div>

<script>
    // 제어 문자 검출용 정규식 패턴 정의
    const PATTERNS = {
        tab: /\t/g,
        nullChar: /\x00/g,
        zw: /[\u200B-\u200D\uFEFF]/g,
        // 일반 공백/개행을 제외한 시스템 제어용 아스키 문자군 검출
        other: /[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]/g
    };

    const jsonArea = document.getElementById('json-input');
    const yamlArea = document.getElementById('yaml-input');
    const statusBoard = document.getElementById('status-board');
    let toastTimeout = null;

    // 양쪽 텍스트박스 입력 발생 시 실시간 문자 분석 갱신
    jsonArea.addEventListener('input', runCharacterAnalysis);
    yamlArea.addEventListener('input', runCharacterAnalysis);

    function runCharacterAnalysis() {
        // 양쪽 텍스트를 병합하여 특수문자 카운트 계산
        const combinedText = jsonArea.value + "\n" + yamlArea.value;

        document.getElementById('cnt-tab').innerText = (combinedText.match(PATTERNS.tab) || []).length;
        document.getElementById('cnt-null').innerText = (combinedText.match(PATTERNS.nullChar) || []).length;
        document.getElementById('cnt-zw').innerText = (combinedText.match(PATTERNS.zw) || []).length;
        document.getElementById('cnt-other').innerText = (combinedText.match(PATTERNS.other) || []).length;
    }

    // 상태 메시지 출력 유틸리티
    function showStatus(message, isError = false) {
        if (toastTimeout) {
            clearTimeout(toastTimeout);
        }

        statusBoard.innerText = message;
        statusBoard.style.display = 'flex';

        if (isError) {
            statusBoard.classList.add('error');
        } else {
            statusBoard.classList.remove('error');
        }

        // 3.5초 뒤 자동 페이드아웃 효과
        toastTimeout = setTimeout(() => {
            statusBoard.style.display = 'none';
        }, 3500);
    }

    // 1. JSON ➔ YAML 변환 실행
    function convertToYaml() {
        const jsonText = jsonArea.value.trim();
        if (!jsonText) {
            showStatus("⚠ JSON 입력 창에 데이터를 작성해 주세요.", true);
            return;
        }

        try {
            const parsedData = JSON.parse(jsonText);
            // 4 Spaces 들여쓰기 옵션을 준수하여 가공 및 주입
            const convertedYaml = jsyaml.dump(parsedData, { indent: 4, flowLevel: -1 });
            yamlArea.value = convertedYaml;
            
            runCharacterAnalysis();
            showStatus("✅ JSON이 성공적으로 YAML 포맷으로 변환되었습니다!");
        } catch (error) {
            showStatus("❌ JSON 구문 분석 실패: " + error.message, true);
        }
    }

    // 2. YAML ➔ JSON 변환 실행
    function convertToInvertedJson() {
        const yamlText = yamlArea.value.trim();
        if (!yamlText) {
            showStatus("⚠ YAML 입력 창에 데이터를 작성해 주세요.", true);
            return;
        }

        try {
            const parsedData = jsyaml.load(yamlText);
            // 4 Spaces 들여쓰기를 정밀 적용하여 정렬 출력
            const convertedJson = JSON.stringify(parsedData, null, 4);
            jsonArea.value = convertedJson;

            runCharacterAnalysis();
            showStatus("✅ YAML이 성공적으로 JSON 포맷으로 변환되었습니다!");
        } catch (error) {
            showStatus("❌ YAML 구문 분석 실패: " + error.message, true);
        }
    }

    // 3. 왼쪽 데이터 완전 청소
    function clearJson() {
        jsonArea.value = "";
        runCharacterAnalysis();
        showStatus("🧹 좌측 JSON 에디터 창이 완전히 비워졌습니다.");
    }

    // 4. 오른쪽 데이터 완전 청소
    function clearYaml() {
        yamlArea.value = "";
        runCharacterAnalysis();
        showStatus("🧹 우측 YAML 에디터 창이 완전히 비워졌습니다.");
    }

    // 5. 안전한 클립보드 복사 기법 구현 (Iframe 대응 완벽 보완)
    function copyYaml() {
        const contentToCopy = yamlArea.value.trim();
        if (!contentToCopy) {
            showStatus("⚠ 복사할 YAML 데이터 결과가 존재하지 않습니다.", true);
            return;
        }

        // 임시 텍스트 에어리어를 활용한 안정성 최우선 복사 로직
        const tempTextArea = document.createElement("textarea");
        tempTextArea.value = contentToCopy;
        tempTextArea.style.position = "fixed";
        tempTextArea.style.top = "0";
        tempTextArea.style.left = "0";
        tempTextArea.style.opacity = "0";
        document.body.appendChild(tempTextArea);
        tempTextArea.select();

        try {
            const successful = document.execCommand('copy');
            if (successful) {
                showStatus("📋 변환된 YAML 결과물이 성공적으로 클립보드에 복사되었습니다!");
            } else {
                showStatus("❌ 복사 명령에 실패했습니다. 수동으로 복사해 주세요.", true);
            }
        } catch (err) {
            showStatus("❌ 클립보드 복사 중 오류 발생: " + err.message, true);
        } finally {
            document.body.removeChild(tempTextArea);
        }
    }

    // 최초 로드 시 분석 활성화
    window.onload = function() {
        runCharacterAnalysis();
    };
</script>

</body>
</html>
